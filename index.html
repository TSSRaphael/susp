<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine?</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .container {
      text-align: center;
      position: relative;
      width: 100%;
      height: 100%;
    }

    h1 {
      margin-top: 80px;
      color: #fff;
      font-size: 3rem;
    }

    button {
      font-size: 1.5rem;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yes {
      background-color: #4CAF50;
      color: white;
      margin-right: 20px;
    }

    #no {
      background-color: #f44336;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Will you be my Valentine? 💖</h1>

    <button id="yes">Yes 💘</button>
    <button id="no">No 💔</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    // place "No" somewhere initially
    function randomPosition() {
      const padding = 100;
      const x = Math.random() * (window.innerWidth - padding);
      const y = Math.random() * (window.innerHeight - padding);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    randomPosition();

    document.addEventListener("mousemove", (e) => {
      const rect = noBtn.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 120) {
        // shrink and move "No"
        noBtn.style.transform = "scale(0.7)";
        randomPosition();

        // grow "Yes"
        yesBtn.style.transform = "scale(1.3)";
      } else {
        noBtn.style.transform = "scale(1)";
        yesBtn.style.transform = "scale(1)";
      }
    });

    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = "<h1 style='color:white;'>YAY!!! 💕🥰</h1>";
    });
  </script>
</body>
</html>
